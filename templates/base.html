<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shohjahon | Cosmic Space Portfolio</title>
  
  <!-- Brauzer Tab Faviconi -->
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/favicon.svg') }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="container navbar__inner">
      <!-- 3D Orb Logotip va Brend Nomi -->
      <a href="#hero" class="navbar__brand mono">
        <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="Logo" class="navbar__logo-img">
        <span class="brand-text"><span data-i18n="brand_title">{{ t.brand_title }}</span><span class="brand-accent" data-i18n="brand_ext">{{ t.brand_ext }}</span></span>
      </a>

      <ul class="navbar__menu">
        <li><a href="#about" data-i18n="nav_about">{{ t.nav_about }}</a></li>
        <li><a href="#projects" data-i18n="nav_projects">{{ t.nav_projects }}</a></li>
        <li><a href="#skills" data-i18n="nav_skills">{{ t.nav_skills }}</a></li>
        <li><a href="#contact" data-i18n="nav_contact">{{ t.nav_contact }}</a></li>
      </ul>

      <!-- Til o'tkazgich -->
      <div class="lang-switcher mono">
        <button type="button" class="lang-btn {% if current_lang == 'uz' %}active{% endif %}" data-lang="uz">UZ</button>
        <span class="divider">/</span>
        <button type="button" class="lang-btn {% if current_lang == 'ru' %}active{% endif %}" data-lang="ru">RU</button>
        <span class="divider">/</span>
        <button type="button" class="lang-btn {% if current_lang == 'en' %}active{% endif %}" data-lang="en">EN</button>
      </div>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <footer class="footer">
    <div class="container">
      <p class="mono" data-i18n="footer_text">{{ t.footer_text }}</p>
    </div>
  </footer>

  <script id="i18n-translations" type="application/json">{{ translations_json | safe }}</script>
  <script id="i18n-projects" type="application/json">{{ projects_json | safe }}</script>
  <script id="i18n-skills" type="application/json">{{ skills_json | safe }}</script>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
