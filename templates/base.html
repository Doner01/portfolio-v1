<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | Python Backend &amp; 3D Developer</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="container navbar__inner">
      <!-- Zamonaviy Brand Logo -->
      <a href="#hero" class="navbar__brand mono">
        <span class="status-indicator"></span>
        <span class="brand-text">{{ t.brand_title }}<span class="brand-accent">{{ t.brand_ext }}</span></span>
      </a>

      <!-- Menyu bo'limlari -->
      <ul class="navbar__menu">
        <li><a href="#projects">{{ t.nav_projects }}</a></li>
        <li><a href="#skills">{{ t.nav_skills }}</a></li>
        <li><a href="#contact">{{ t.nav_contact }}</a></li>
      </ul>

      <!-- Til o'tkazgich -->
      <div class="lang-switcher mono">
        <a href="{{ url_for('set_language', lang_code='uz') }}" class="lang-btn {% if current_lang == 'uz' %}active{% endif %}">UZ</a>
        <span class="divider">/</span>
        <a href="{{ url_for('set_language', lang_code='en') }}" class="lang-btn {% if current_lang == 'en' %}active{% endif %}">EN</a>
      </div>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <footer class="footer">
    <div class="container">
      <p class="mono">{{ t.footer_text }}</p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
